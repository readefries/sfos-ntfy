name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (tags and releases).
permissions:
  contents: read

jobs:
  build:
    name: SailfishOS ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.1.0.11 is the oldest supported release and the newest official SDK target.
        # 5.2 has no official target yet; the community image covers it.
        include:
          - { release: 5.1.0.11, arch: aarch64 }
          - { release: 5.1.0.11, arch: armv7hl }
          - { release: 5.1.0.11, arch: i486 }
          - { release: 5.2.0.15, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      # %check in the spec runs the Qt tests.
      - name: Build RPM and run tests
        run: scripts/docker-build.sh ${{ matrix.release }} ${{ matrix.arch }}
        env:
          # The SDK's scratchbox2 can't start its daemon under the runner's default container
          # restrictions ("sb2d: Failed to create server socket"); the community action
          # (CODeRUS/github-sfos-build) runs privileged for the same reason.
          DOCKER_RUN_ARGS: --privileged

      - uses: actions/upload-artifact@v4
        with:
          name: harbour-ntfy-${{ matrix.release }}-${{ matrix.arch }}
          path: build-docker/${{ matrix.release }}-${{ matrix.arch }}/*.rpm
          if-no-files-found: error

  # Once every build passed on main: semantic-release reads the Conventional Commits since the
  # last vX.Y.Z tag, decides the next version (fix: patch, feat: minor, BREAKING CHANGE: major) and
  # creates that tag plus a GitHub release with the changes. It doesn't commit anything: OBS takes
  # the version from the tag, so main only ever has the developer's (signed) commits.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all commits and tags, to work out the next version
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The preset's major version must match the changelog writer semantic-release bundles
      # (25.x: conventional-changelog-writer 8, so preset 9.x); 10.x fails to render notes.
      - name: Release
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
